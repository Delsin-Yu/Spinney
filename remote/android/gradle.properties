# JVM running the Gradle daemon: the Android/Kotlin toolchain needs more than the
# 512 MB default metaspaces. Sized to stay comfortable on a dev box.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# AndroidX is required by every Compose artifact; AGP 8 refuses to build without it.
android.useAndroidX=true
# Smaller R classes, less to merge.
android.nonTransitiveRClass=true

# Build hygiene / speed.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

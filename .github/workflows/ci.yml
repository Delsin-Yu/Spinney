name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # One step, because the gate is one list: `vscode:prepublish` compiles, runs
      # `sync:l10n`, and runs the eight guards (docs/agents/testing.md). Listing the
      # guards here individually is how this job previously fell four of them behind.
      - name: Release gate
        run: npm run vscode:prepublish
